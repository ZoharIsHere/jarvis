name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hud-logic:
    # Pure-logic tests only — no Rust build, no macOS runner needed, so this
    # stays fast. The native build is verified locally (see JARVIS_MASTER.md §9).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
